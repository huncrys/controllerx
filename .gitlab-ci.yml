stages:
  - test

test:
  stage: test
  image: python:${PYTHON_VERSION}
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12"]
  before_script:
    - pip install poetry==1.4.0
    - poetry config virtualenvs.in-project true
    - poetry install --only main,test
  script:
    - poetry run pytest tests --doctest-modules --junitxml=junit/test-results.xml --cov=apps --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.*\s+(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    reports:
      junit: junit/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  cache:
    key:
      files:
        - poetry.lock
      prefix: ${CI_JOB_NAME}
    paths:
      - .venv
